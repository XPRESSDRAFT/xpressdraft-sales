<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpress Draft — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #EA672F;
    --dark:   #2A2B29;
    --page:   #F3EAE5;
    --w1:     rgba(255,255,255,.6);
    --radius: 12px;
  }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--page);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 24px 80px rgba(0,0,0,.4);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }
  .logo-text { font-size: 20px; font-weight: 800; color: var(--dark); }
  .logo-text span { color: var(--orange); }
  .title { font-size: 22px; font-weight: 700; color: var(--dark); margin-bottom: 6px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #666; margin-bottom: 6px; }
  .field input {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--dark);
    background: #fff;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    padding: 12px 14px;
    outline: none;
    transition: .15s;
  }
  .field input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(234,103,47,.12); }
  .btn-login {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    margin-top: 8px;
    transition: .15s;
  }
  .btn-login:hover { background: #d45a26; }
  .error {
    background: #fde8e8;
    border: 1px solid #f5c6c6;
    color: #c0392b;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .confidential {
    text-align: center;
    font-size: 11px;
    color: #aaa;
    margin-top: 24px;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 191 189" xmlns="http://www.w3.org/2000/svg">
      <path fill="#2A2B29" d="M46.6 6.5v29.6c0 1.9 1.1 3.7 2.8 4.5l42.8 23.9c1.9.9 4.1.9 6 0l42.8-23.9c1.7-.8 2.8-2.6 2.8-4.5V6.5c0-4.8-5-7.9-9.3-5.9L98.3 18c-1.9.9-4.1.9-6 0L55.9.6c-4.3-2-9.3 1.1-9.3 5.9"/>
      <path fill="#2A2B29" d="M46.6 181.2v-29.6c0-1.9 1.1-3.7 2.8-4.5l42.8-23.9c1.9-.9 4.1-.9 6 0l42.8 23.9c1.7.8 2.8 2.6 2.8 4.5v29.6c0 4.8-5 7.9-9.3 5.9L98.3 169.8c-1.9-.9-4.1-.9-6 0l-36.4 17.3c-4.3 2-9.3-1.1-9.3-5.9"/>
      <path fill="#2A2B29" d="M182.6 45.2h-29.6c-1.9 0-3.7 1.1-4.5 2.8l-23.9 42.8c-.9 1.9-.9 4.1 0 6l23.9 42.8c.8 1.7 2.6 2.8 4.5 2.8h29.6c4.8 0 7.9-5 5.9-9.3l-17.4-36.3c-.9-1.9-.9-4.1 0-6l17.4-36.3c2-4.3-1.1-9.3-5.9-9.3"/>
      <path fill="#EA672F" d="M7.9 45.2h29.6c1.9 0 3.7 1.1 4.5 2.8l23.9 42.8c.9 1.9.9 4.1 0 6l-23.9 42.8c-.8 1.7-2.6 2.8-4.5 2.8H7.9c-4.8 0-7.9-5-5.9-9.3l17.4-36.3c.9-1.9.9-4.1 0-6L2 54.5c-2-4.3 1.1-9.3 5.9-9.3"/>
    </svg>
    <div class="logo-text"><span>Xpress</span> Draft</div>
  </div>
  <div class="title">Welcome back</div>
  <div class="sub">Internal sales tool — authorised users only</div>

  <form method="POST" action="/login">
    <div id="errorBox" class="error" style="display:none">Incorrect email or password. Try again.</div>
    <div class="field">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@xpressdraft.com.au" required autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login">Sign in</button>
  </form>
  <div class="confidential">Confidential — internal use only</div>
</div>
<script>
  if (window.location.search.includes('error=1')) {
    document.getElementById('errorBox').style.display = 'block';
  }
</script>
</body>
</html>
